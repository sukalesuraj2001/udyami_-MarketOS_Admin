<div class="phead">
  <div><h1>Feature flags</h1><p>Voice calling stays locked until both gates pass — the Kannada dialect test and DLT registration. The toggle won't move without them.</p></div>
  <select class="inp" style="width:auto" [(ngModel)]="selectedTenant" (ngModelChange)="load()">
    @for (t of tenants; track t) { <option [value]="t">{{ t }}</option> }
  </select>
</div>

<div class="card">
  @if (loading()) {
    <app-skeleton [height]="220" />
  } @else {
    @for (f of flags(); track f.id) {
      <div class="rowb" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--color-border)">
        <div>
          <b style="font-size:13px">{{ f.name }}</b>
          @if (f.locked) {
            <div class="mini" style="color:var(--color-warning);font-size:11.5px">Locked — {{ f.lockReason }}</div>
          }
        </div>
        <app-toggle [checked]="f.enabled" [disabled]="f.locked" [ariaLabel]="f.name" (toggled)="toggle(f)" />
      </div>
    }
  }
</div>
